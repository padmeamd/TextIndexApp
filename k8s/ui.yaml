apiVersion: apps/v1
kind: Deployment
metadata:
  name: testapp-ui
  namespace: testapp
  labels:
    app: testapp-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testapp-ui
  template:
    metadata:
      labels:
        app: testapp-ui
    spec:
      containers:
        - name: testapp-ui
          image: localhost:5000/testapp-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: testapp-ui
  namespace: testapp
  labels:
    app: testapp-ui
spec:
  selector:
    app: testapp-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
